name: Cart Service CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: Cấp quyền thực thi Gradle Wrapper
      run: chmod +x ./gradlew
    - name: Build with Gradle
      run: ./gradlew bootJar
